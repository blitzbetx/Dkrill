<!DOCTYPE html>
<!--
  ╔═══════════════════════════════════════════════════════════════════╗
  ║  OBSCURA — How niche can you go?                                  ║
  ║  A daily trivia game in a single file. Put this index.html in a   ║
  ║  GitHub repo and turn on GitHub Pages (Settings → Pages →         ║
  ║  Deploy from branch → main / root).                               ║
  ╚═══════════════════════════════════════════════════════════════════╝

  ── HOW THE GAME WORKS ────────────────────────────────────────────────
  10 categories a day. Every valid answer has a hidden rarity
  (Common → Uncommon → Rare → Epic → Legendary). Name an answer, flip the
  card, then either BANK or GO RARER. Round score = card points × number
  of cards. If a new card isn't rarer than the last one, you BUST (0 pts).

  ── ADMIN: CATEGORY STUDIO ────────────────────────────────────────────
  Open your site with #studio on the end, e.g.
      https://yourname.github.io/obscura/#studio
  There you can write a category, sort answers into rarities (or paste
  a ranked list and let it split them), TEST PLAY it, and copy a ready-made
  line of code to paste into the CATS list below. If the leaderboard is
  switched on, "Calibrate" re-sorts rarities using what real players
  actually answered.

  ── GLOBAL LEADERBOARD (optional, free, ~5 minutes) ──────────────────
  1. Create a free project at https://supabase.com
  2. SQL Editor → paste this → Run:

      create table scores (
        id bigint generated always as identity primary key,
        day text not null,
        name text not null check (char_length(name) between 1 and 20),
        score int not null check (score between 0 and 50000),
        answers jsonb not null,
        created_at timestamptz default now()
      );
      alter table scores enable row level security;
      create policy "read"   on scores for select using (true);
      create policy "insert" on scores for insert with check (true);

  3. Project Settings → API: copy the Project URL and the "anon public"
     key into CONFIG below. (The anon key is meant to be public.)
  Without these, everything still works; players see their own history.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obscura — How niche can you go?</title>
<meta name="description" content="A daily trivia game: name the most obscure answer you can, then risk it all to go rarer.">
<meta name="theme-color" content="#0c0a17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a17;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.11);--ink:#f4f2ff;--mute:#a9a3c6;--brand:#ff5fa2;--brand2:#a35bff;--good:#4ade80;--bad:#ff4d5e;--gold:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:-25%;z-index:0;pointer-events:none;background:radial-gradient(35% 30% at 20% 25%,rgba(255,95,162,.16),transparent 70%),radial-gradient(35% 30% at 80% 30%,rgba(124,92,255,.2),transparent 70%),radial-gradient(40% 35% at 50% 85%,rgba(56,189,248,.1),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(5%,-4%) rotate(8deg) scale(1.1)}}
main{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:8px 16px 90px}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','Space Grotesk',sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px 18px;transition:transform .15s,background .2s,box-shadow .2s,opacity .2s}
button:hover{transform:translateY(-2px);background:rgba(255,255,255,.13)}
button:active{transform:translateY(0) scale(.97)}
button:disabled{opacity:.4;pointer-events:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn-main{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(255,95,162,.28)}
.btn-main:hover{background:linear-gradient(135deg,#ff78b3,#b375ff);box-shadow:0 12px 30px rgba(255,95,162,.42)}
.big{padding:16px 24px;font-size:18px}
.wide{width:100%}
.link{background:none;border:0;padding:8px 4px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.link:hover{background:none;color:var(--ink);transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px}
.center{justify-content:center;text-align:center}
.muted{color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.panel+.panel{margin-top:14px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
.pill{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--panel2);color:var(--mute)}
code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:.9em}
.enter{animation:enter .45s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}}

/* header */
header.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.logo{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;letter-spacing:.08em;background:none;border:0;padding:4px 0;background-image:linear-gradient(135deg,#fff,#d7c9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo:hover{background-color:transparent;transform:none}
.icons{margin-left:auto;display:flex;gap:6px}
.icon{width:40px;height:40px;padding:0;border-radius:12px;font-size:16px;display:grid;place-items:center}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pips{flex:1;display:flex;gap:4px}
.pips i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.1);transition:background .4s}
.pips i.done{background:var(--c,var(--good))}
.pips i.bust{background:var(--bad)}
.pips i.now{background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.scorebox{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;min-width:70px;text-align:right}
.scorebox small{font-family:'Space Grotesk';font-size:12px;color:var(--mute);font-weight:500;margin-left:3px}
.scorebox.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25);color:var(--gold)}}

/* home */
.hero{text-align:center;padding:10px 0 0}
.fan{position:relative;height:150px;margin:8px auto 4px;width:280px}
.mini{position:absolute;left:50%;bottom:0;width:72px;height:100px;margin-left:-36px;border-radius:12px;border:2px solid var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,#16122a),#14102a 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transform-origin:50% 130%;transform:rotate(calc((var(--i) - 2) * 14deg)) translateY(calc(abs(var(--i) - 2) * 6px));animation:deal .7s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i) * 90ms);box-shadow:0 10px 25px rgba(0,0,0,.35)}
.mini small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:700}
.mini b{font-family:'Bricolage Grotesque';font-size:22px}
.mini:nth-child(5)::after{content:'';position:absolute;inset:0;border-radius:10px;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);background-size:250% 100%;animation:sheen 2.8s ease-in-out infinite}
@keyframes deal{from{transform:rotate(0) translateY(60px);opacity:0}}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
.hero h1{font-size:46px;line-height:1;margin:18px 0 12px;font-weight:800}
.hero h1 span{background:linear-gradient(135deg,var(--brand),var(--brand2),#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mute);line-height:1.55;margin:0 auto 18px;max-width:440px;font-size:16px}
.today{display:inline-flex;gap:10px;font-size:13px;color:var(--mute);margin-bottom:18px}
.today span+span::before{content:'·';margin-right:10px}
.cta{display:grid;gap:12px;max-width:380px;margin:0 auto}
.cta .row button{flex:1}
.done-box{background:var(--panel2);border-radius:14px;padding:12px;margin:0 auto 14px;max-width:380px;font-size:15px}

/* play */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.round-tag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.round-tag b{font-size:13px;color:var(--mute);font-weight:500;margin-right:auto}
.cat{display:flex;gap:14px;align-items:center}
.cat .emoji{font-size:40px;line-height:1;animation:pop .5s .1s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
.cat h2{margin:0;font-size:28px;line-height:1.1}
.dist{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:14px 0 4px;font-size:13px}
.dist .dl{color:var(--mute);margin-right:4px}
.dc{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:700;transition:opacity .3s}
.dc i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dc.dim{opacity:.25}
.hand{display:grid;gap:8px;perspective:900px;margin:16px 0 8px}
.card,.slot{height:58px;border-radius:14px}
.slot{border:2px dashed rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute);animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{border-color:rgba(255,255,255,.5)}}
.card{position:relative}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(180deg)}
.card.reveal .inner{animation:flip .62s cubic-bezier(.3,1.35,.5,1) both}
@keyframes flip{from{transform:translateY(-24px) rotateX(0) scale(.9)}55%{transform:translateY(0) rotateX(200deg) scale(1.04)}to{transform:translateY(0) rotateX(180deg) scale(1)}}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;gap:12px;padding:0 16px;overflow:hidden}
.back{background:repeating-linear-gradient(45deg,#2a2346 0 10px,#231d3c 10px 20px);border:2px solid #40366c;justify-content:center;font-family:'Bricolage Grotesque';font-size:26px;color:#7d71bd;font-weight:800}
.front{transform:rotateX(180deg);background:linear-gradient(100deg,color-mix(in srgb,var(--c) 26%,#17132c),#15112a 70%);border:2px solid var(--c)}
.front .tier{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700;width:76px;flex:none}
.front b{flex:1;font-size:17px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.front em{font-style:normal;font-weight:800;color:var(--c);font-family:'Bricolage Grotesque';font-size:18px}
.card.t3 .front{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 24px color-mix(in srgb,var(--c) 65%,transparent)}}
.card.t4 .front{box-shadow:0 0 26px rgba(251,191,36,.45)}
.card.t4 .front::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);background-size:250% 100%;animation:sheen 2.4s ease-in-out infinite;pointer-events:none}
.card.bust .front{border-color:var(--bad);background:linear-gradient(100deg,rgba(255,77,94,.25),#15112a 70%)}
.card.bust .front em{color:var(--bad)}
.card.bust .front b{text-decoration:line-through;text-decoration-color:var(--bad)}
.card.fall{animation:fall .9s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes fall{15%{transform:translateY(-8px) rotate(-2deg)}to{transform:translateY(140px) rotate(9deg);opacity:0}}
.card.banked{animation:lift .6s ease both}
@keyframes lift{45%{transform:translateY(-8px) scale(1.03);filter:brightness(1.4)}}
.pot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:4px 2px;font-size:14px}
.pot .eq{color:var(--mute)}
.pot .pv{font-family:'Bricolage Grotesque';font-size:28px;font-weight:800;display:inline-block}
.pot .pv.bump{animation:bump .5s}
.pot .pv small{font-size:13px;color:var(--mute);margin-left:3px;font-family:'Space Grotesk';font-weight:500}
.pot.res{justify-content:center;padding:10px 0}
.stamp{font-family:'Bricolage Grotesque';font-weight:800;font-size:44px;padding:2px 22px;border:4px solid;border-radius:16px;transform:rotate(-5deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;display:inline-block}
.stamp.good{color:var(--good)}.stamp.bad{color:var(--bad)}.stamp.meh{color:var(--mute);font-size:30px}
@keyframes stamp{from{transform:rotate(-5deg) scale(2.6);opacity:0}}
form.guess{display:flex;gap:8px}
form.guess input{flex:1;min-width:0;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.35);font-size:17px;outline:none;transition:border-color .2s}
form.guess input:focus{border-color:var(--brand)}
.help{font-size:14px;color:var(--mute);margin:10px 2px 0;line-height:1.5}
.help b{color:var(--ink)}
.risk{display:inline-block;color:var(--gold);font-weight:700;margin-right:6px;animation:pulse 1.6s infinite}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;text-align:left;border-radius:16px}
.choice span{font-weight:700;font-size:16px}
.choice b{font-family:'Bricolage Grotesque';font-size:26px}
.choice small{color:var(--mute);font-size:12px}
.choice .bank{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.08)}
.choice .climb{border-color:rgba(255,95,162,.6);background:linear-gradient(135deg,rgba(255,95,162,.16),rgba(163,91,255,.16))}
.choice .climb b{color:#ffb3d4}
.kbd{font-size:11px;color:var(--mute);opacity:.7}
#action.locked{pointer-events:none;opacity:.45;transition:opacity .2s}
.fb{min-height:24px;margin-top:10px;font-size:15px;line-height:1.5}
.fb.bad{color:#ff8a96}.fb.good{color:var(--good)}
.fb .sugg{margin:6px 6px 0 0;padding:8px 14px;border-radius:99px;font-weight:700;border-color:var(--brand);background:rgba(255,95,162,.12)}
.fb .sugg.ghost{border-color:var(--line);background:transparent;font-weight:500}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.why{color:var(--mute);line-height:1.5;margin:4px 0 12px;text-align:center}
.why b{color:var(--ink)}
.missed{margin:6px 0 16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--c);color:var(--c);animation:enter .35s both}
.float{position:fixed;z-index:60;font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.6);animation:floatUp 1.15s ease-out forwards}
@keyframes floatUp{from{transform:translate(-50%,0) scale(.5);opacity:0}20%{opacity:1;transform:translate(-50%,-12px) scale(1.2)}to{transform:translate(-50%,-80px) scale(1);opacity:0}}
.flash{position:fixed;inset:0;z-index:55;pointer-events:none;animation:flash .6s ease-out forwards}
@keyframes flash{to{opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:58}

/* final */
.final{text-align:center}
.total{font-family:'Bricolage Grotesque';font-weight:800;font-size:76px;line-height:1;margin-top:10px;background:linear-gradient(135deg,#fff,#ffc2dd);-webkit-background-clip:text;background-clip:text;color:transparent}
.title-badge{display:inline-block;margin:12px 0 4px;padding:6px 16px;border-radius:99px;background:linear-gradient(135deg,rgba(255,95,162,.2),rgba(163,91,255,.2));border:1px solid rgba(255,95,162,.4);font-weight:700;animation:enter .5s .9s both}
.grid{display:inline-grid;gap:4px;margin:18px auto 6px;text-align:left}
.gr{display:flex;gap:4px;align-items:center;animation:enter .35s both;animation-delay:var(--d)}
.gr span{font-size:12px;color:var(--mute);width:18px;text-align:right;margin-right:4px}
.tile{width:22px;height:22px;border-radius:6px;background:var(--c)}
.tile.x{background:var(--bad);display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;font-style:normal}
.tile.e{background:rgba(255,255,255,.1)}
.gr em{font-style:normal;font-size:12px;color:var(--mute);margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.stat{background:var(--panel2);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:'Bricolage Grotesque';font-size:24px}
.stat small{color:var(--mute);font-size:11px}
.log{display:grid;gap:10px;text-align:left}
.lr{background:var(--panel2);border-radius:14px;padding:12px 14px}
.lr h4{margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;font-size:15px}
.lr h4 span{font-family:'Bricolage Grotesque';color:var(--good)}
.lr h4 span.z{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:9px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.chip.x{--c:var(--bad)!important;text-decoration:line-through}
.chip .pk{color:var(--mute);margin-left:5px;font-size:11px}
.field{display:flex;gap:8px;margin-top:10px}
.field input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);outline:none}
.hist{display:flex;align-items:flex-end;gap:3px;height:90px;margin:16px 0 4px}
.hist div{flex:1;background:rgba(255,255,255,.16);border-radius:4px 4px 0 0;min-height:2px;transform-origin:bottom;animation:grow .6s both}
.hist div.me{background:linear-gradient(var(--brand),var(--brand2))}
@keyframes grow{from{transform:scaleY(0)}}
.hist-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
table.board{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px;text-align:left}
.board td{padding:9px 6px;border-bottom:1px solid var(--line)}
.board td:first-child{color:var(--mute);width:40px}
.board td:last-child{text-align:right;font-weight:700}
.board tr.me td{color:var(--brand)}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(6,4,14,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal.hidden{display:none}
.sheet{position:relative;width:100%;max-width:520px;background:#141029;border:1px solid var(--line);border-radius:24px;padding:26px;animation:enter .35s cubic-bezier(.2,.9,.3,1.1)}
.sheet .x{position:absolute;top:14px;right:14px;width:36px;height:36px;padding:0;font-size:20px;border-radius:10px}
.sheet h2{margin:0 0 6px;font-size:26px;padding-right:40px}
.sheet p{color:var(--mute);line-height:1.6}
.sheet p b{color:var(--ink)}
.slide{min-height:330px;display:flex;flex-direction:column}
.slide .vis{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;margin:14px 0;perspective:900px}
.slide .vis .card{animation:enter .4s both}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:.3s}
.dots i.on{background:var(--brand);width:22px;border-radius:9px}
.demo-cat{font-family:'Bricolage Grotesque';font-size:22px;font-weight:800;text-align:center;margin-bottom:6px}
.demo-eq{text-align:center;color:var(--mute);margin-top:6px}
.demo-eq b{color:var(--ink);font-size:20px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
.daynav button{padding:8px 14px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120px);background:#fff;color:#1a1530;padding:12px 18px;border-radius:14px;font-weight:700;z-index:70;transition:transform .35s cubic-bezier(.2,1.3,.4,1);pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}

/* studio */
.studio h2{margin-top:0}
.fld{display:grid;gap:6px;margin:10px 0;font-size:14px}
.fld>span{color:var(--mute)}
.fld input,.fld select,.fld textarea,.tierbox textarea,details textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);outline:none;resize:vertical}
.fld select option{background:#141029}
.fgrid{display:grid;grid-template-columns:80px 1fr 1fr;gap:10px}
details{background:var(--panel2);border-radius:14px;padding:12px 14px;margin:12px 0}
details summary{cursor:pointer;font-weight:700}
.tierbox{border-left:4px solid var(--c);background:rgba(255,255,255,.03);border-radius:12px;padding:10px 12px;margin:10px 0}
.tierbox .th{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;font-size:13px}
.tierbox .th b{color:var(--c);font-size:15px}
.tierbox .th span{color:var(--mute);flex:1}
.tierbox .th em{font-style:normal;font-weight:700;color:var(--c)}
.warn{font-size:14px;line-height:1.6;color:var(--gold);margin:8px 0}
.warn .ok{color:var(--good)}
.cal{width:100%;font-size:13px;border-collapse:collapse;margin:10px 0}
.cal td{padding:5px 4px;border-bottom:1px solid var(--line)}

@media (max-width:520px){
  .hero h1{font-size:38px}
  .cat h2{font-size:23px}.cat .emoji{font-size:34px}
  .stage{padding:16px}
  .front{padding:0 12px;gap:8px}.front .tier{width:62px;font-size:9px}.front b{font-size:15px}
  .choice b{font-size:22px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .total{font-size:62px}
  .fgrid{grid-template-columns:70px 1fr}.fgrid .fld:last-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}}

/* ════════════════════════ ENGINE ════════════════════════ */
function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\+/g,'plus').replace(/#/g,'sharp').replace(/&/g,'and').replace(/♀/g,'f').replace(/♂/g,'m')
    .replace(/ø/g,'o').replace(/ð/g,'d').replace(/æ/g,'ae').replace(/ß/g,'ss').replace(/ł/g,'l').replace(/ı/g,'i')
    .replace(/^(the|a|an)\s+/,'').replace(/[^a-z0-9]/g,'');
}
function buildCat(row){
  const [emoji,theme,t,prompt,...tiers]=row, list=[], idx=new Map();
  tiers.slice(0,5).forEach((s,z)=>String(s||'').split('|').forEach(e=>{
    const al=e.split('/').map(x=>x.trim()).filter(Boolean); if(!al.length) return;
    const k0=norm(al[0]); if(!k0) return;
    if(idx.has(k0) && idx.get(k0).name===al[0]) return;   // exact duplicate line
    const item={name:al[0],z}; list.push(item);
    al.forEach(a=>{const k=norm(a); if(k && !idx.has(k)) idx.set(k,item);});
  }));
  return {emoji,theme,t,prompt,list,idx,row};
}
const BANK=CATS.map(buildCat), BY_T=new Map(BANK.map(c=>[c.t,c]));

// Damerau–Levenshtein (optimal string alignment) — powers the spelling suggestions
function dist(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  const d=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1);r[0]=i;return r}); for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
// Returns {type:'exact',item} | {type:'suggest',items:[...]} | {type:'none'}
function lookup(c,raw){
  const n=norm(raw); if(!n) return {type:'none'};
  const tries=[n]; if(n.endsWith('es')) tries.push(n.slice(0,-2)); if(n.endsWith('s')) tries.push(n.slice(0,-1)); tries.push(n+'s',n+'es');
  for(const t of tries) if(c.idx.has(t)) return {type:'exact',item:c.idx.get(t)};
  if(n.length<3) return {type:'none'};
  const best=new Map();
  for(const [k,item] of c.idx){
    const L=Math.max(k.length,n.length);
    let sim=0;
    if(Math.abs(k.length-n.length)<=Math.max(3,L*.45)) sim=1-dist(n,k)/L;
    if(n.length>=4&&k.startsWith(n)) sim=Math.max(sim,.82);
    else if(n.length>=5&&k.includes(n)) sim=Math.max(sim,.74);
    if(sim>(best.get(item)||0)) best.set(item,sim);
  }
  const ranked=[...best].filter(([,s])=>s>=(n.length<=4?.7:.6)).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([it])=>it);
  return ranked.length?{type:'suggest',items:ranked}:{type:'none'};
}

// Daily selection: least-recently-used categories first, max 2 per theme, same for everyone
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickTen(rng,last,d){
  const order=BANK.map((c,i)=>({i,k:(last[i]==null?1e6:d-last[i])+rng()*3})).sort((a,b)=>b.k-a.k);
  const out=[],tc={};
  for(const o of order){const th=BANK[o.i].theme;if((tc[th]||0)>=2)continue;tc[th]=(tc[th]||0)+1;out.push(o.i);if(out.length===10)break}
  for(const o of order){if(out.length>=10)break;if(!out.includes(o.i))out.push(o.i)}
  return out;
}
function catsForDay(day){const last={};let res=[];for(let d=0;d<=day;d++){res=pickTen(mulberry(d*9973+17),last,d);res.forEach(i=>last[i]=d)}return res.map(i=>BANK[i].t)}

function countUp(el,from,to,ms=700){if(!el)return;if(RM||from===to){el.textContent=to;return}const t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(to-from)*e);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

const SND={on:store.get(KEY+'sound',true),ctx:null,
  t(f,dur=.12,type='sine',vol=.06,when=0){if(!this.on)return;try{this.ctx=this.ctx||new(window.AudioContext||window.webkitAudioContext)();const c=this.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.03)}catch(e){}}};
function sfx(k,z=0){
  if(k==='flip'){SND.t(420,.05,'triangle',.05);SND.t(640,.06,'triangle',.04,.05)}
  else if(k==='tier'){[523,659,784,988,1319].slice(0,z+1).forEach((f,i)=>SND.t(f,.2,'sine',.06,i*.07))}
  else if(k==='bust'){SND.t(180,.3,'sawtooth',.05);SND.t(120,.45,'sawtooth',.05,.12)}
  else if(k==='bank'){[784,1047,1319].forEach((f,i)=>SND.t(f,.14,'square',.025,i*.06))}
  else if(k==='nope'){SND.t(240,.1,'square',.03);SND.t(200,.12,'square',.03,.08)}
  else if(k==='click'){SND.t(700,.04,'triangle',.03)}
  else if(k==='win'){[523,659,784,1047,1319,1568].forEach((f,i)=>SND.t(f,.22,'triangle',.05,i*.09))}
}

/* ── confetti / particles ── */
const FX={c:$('#fx'),x:null,p:[],run:false,
  size(){const d=devicePixelRatio||1;this.c.width=innerWidth*d;this.c.height=innerHeight*d;this.x=this.c.getContext('2d');this.x.setTransform(d,0,0,d,0,0)},
  go(){if(!this.run){this.run=true;requestAnimationFrame(()=>this.loop())}},
  burst(x,y,colors,n=60,power=9){if(RM)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*power+2;this.p.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,r:3+Math.random()*4,c:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:70+Math.random()*50,sq:Math.random()<.5})}this.go()},
  rain(colors,n=160){if(RM)return;for(let i=0;i<n;i++)this.p.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:3+Math.random()*4,c:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.3,life:220,sq:true});this.go()},
  loop(){const x=this.x;x.clearRect(0,0,innerWidth,innerHeight);this.p=this.p.filter(p=>p.life>0&&p.y<innerHeight+40);for(const p of this.p){p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;x.save();x.globalAlpha=Math.min(1,p.life/30);x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;if(p.sq)x.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{x.beginPath();x.arc(0,0,p.r*.7,0,7);x.fill()}x.restore()}if(this.p.length)requestAnimationFrame(()=>this.loop());else{this.run=false;x.clearRect(0,0,innerWidth,innerHeight)}}};
FX.size();addEventListener('resize',()=>FX.size());
function floatText(txt,el,color){const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='float';f.textContent=txt;f.style.left=(r.left+r.width-40)+'px';f.style.top=(r.top-6)+'px';f.style.color=color;document.body.appendChild(f);setTimeout(()=>f.remove(),1200)}

function cat(){return S.kind==='studio'?TEMP:BY_T.get(S.cats[S.i])}
function newGame(kind){
  let cats;
  if(kind==='daily') cats=catsForDay(DAY);
  else if(kind==='practice') cats=pickTen(mulberry((Math.random()*2**31)|0),{},0).map(i=>BANK[i].t);
  else cats=[TEMP.t];
  return {v:3,kind,day:TODAY,num:DAY+1,cats,i:0,hand:[],mode:'pick',rounds:[],phase:'play',total:0,posted:false};
}
function loadSaved(){const s=store.get(KEY+TODAY,null);return s&&s.v===3&&s.cats.every(t=>BY_T.has(t))?s:null}
function save(){if(S&&S.kind==='daily')store.set(KEY+S.day,S)}
const sumPts=h=>h.reduce((s,x)=>s+TIERS[x.z].pts,0);
const potValue=()=>sumPts(S.hand)*S.hand.length;
const topZ=()=>S.hand.length?S.hand[S.hand.length-1].z:-1;
const roundsTotal=()=>S.rounds.reduce((s,r)=>s+r.score,0);

  const c=cat(),cnt=[0,0,0,0,0];c.list.forEach(x=>cnt[x.z]++);const t=S.mode==='result'?-1:topZ();
  $('#dist').innerHTML=`<span class="dl">Answers:</span>`+TIERS.map((T,z)=>`<span class="dc ${z<=t?'dim':''}" style="--c:${T.c}" title="${cnt[z]} ${T.n} answers"><i></i>${cnt[z]} ${T.n}</span>`).join('');
}
function cardHTML(x,reveal){const T=TIERS[x.z];return `<div class="card t${x.z}${x.bust?' bust':''}${reveal?' reveal':''}" style="--c:${T.c}"><div class="inner"><div class="face back">?</div><div class="face front"><span class="tier">${T.n}</span><b title="${esc(x.n)}">${esc(x.n)}</b><em>${x.bust?'BUST':'+'+T.pts}</em></div></div></div>`}
function drawHand(revealIdx=-1){
  let html=S.hand.map((x,k)=>cardHTML(x,k===revealIdx)).join('');
  if(S.mode==='pick'||S.mode==='deeper'){const t=topZ();html+=`<div class="slot">${t<0?'Your first card lands here':`Next card must be rarer than <b style="color:${TIERS[t].c};margin-left:5px">${TIERS[t].n}</b>`}</div>`}
  $('#hand').innerHTML=html;
}
function drawPot(){
  const p=$('#pot'),n=S.hand.length;p.className='pot';
  if(!n){p.innerHTML=`<span class="eq">Round score = card points × number of cards</span>`;return}
  const pts=S.hand.map(h=>TIERS[h.z].pts),sum=pts.reduce((a,b)=>a+b,0);
  p.innerHTML=`<span class="eq">${n>1?`(${pts.join(' + ')})`:pts[0]} × ${n} card${n>1?'s':''}</span><b class="pv" id="pv">${sum*n}<small>pts</small></b>`;
}

  if(S.mode==='pick'||S.mode==='deeper'){
    a.innerHTML=`<form class="guess" id="f" autocomplete="off">
      <input id="in" placeholder="${S.mode==='pick'?'Type an answer…':'Something rarer…'}" maxlength="70" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Your answer">
      <button class="btn-main" type="submit">Play</button></form>
      <div class="help">${S.mode==='pick'
        ?`Type any valid answer. <b>Rarer answers score more</b> — but starting with a common one leaves room to climb the ladder.`
        :`<span class="risk">⚠ ${cur} pts at risk</span>Your answer must be ${TIERS.slice(t+1).map(T=>`<b style="color:${T.c}">${T.n}</b>`).join(' or ')}. Anything less and you bust.`}</div>
      <div class="row center">${S.mode==='pick'?`<button class="link" id="skip" type="button">Skip this round (0 pts)</button>`:`<button class="link" id="back" type="button">Chicken out — bank ${cur} pts instead</button>`}</div>`;
    const inp=$('#in');setTimeout(()=>inp.focus({preventScroll:true}),60);
    $('#f').onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(v&&!busy)submitGuess(v)};
    inp.oninput=()=>{if($('#fb').classList.contains('bad'))fb('')};
    if($('#skip'))$('#skip').onclick=()=>{if(!busy)endRound(false)};
    if($('#back'))$('#back').onclick=()=>{if(!busy)endRound(false)};
  } else if(S.mode==='decide'){
    const nextMin=(sumPts(S.hand)+TIERS[t+1].pts)*(n+1);
    a.innerHTML=`<div class="choice">
      <button class="bank" id="bank"><span>🔒 Bank it</span><b>${cur}</b><small>Lock in &amp; next round <span class="kbd">[B]</span></small></button>
      <button class="climb" id="climb"><span>🔥 Go rarer</span><b>${nextMin}+</b><small>if you beat ${TIERS[t].n} <span class="kbd">[R]</span></small></button>
    </div><div class="help">Going rarer is a gamble: name something rarer than <b style="color:${TIERS[t].c}">${TIERS[t].n}</b> and your round becomes worth at least <b>${nextMin}</b>. If it isn't rarer, you <b>bust</b> and score 0.</div>`;
    $('#bank').onclick=()=>{if(!busy)endRound(false)};
    $('#climb').onclick=goRarer;
  }
}
function goRarer(){if(busy||S.mode!=='decide')return;sfx('click');S.mode='deeper';save();drawDist();drawHand();drawAction();fb('')}

function submitGuess(text){
  const r=lookup(cat(),text);
  if(r.type==='exact') return playCard(r.item);
  if(r.type==='suggest'){
    sfx('click');
    fb(`Did you mean… ${r.items.map((it,k)=>`<button class="sugg" data-k="${k}">${esc(it.name)}</button>`).join('')}<button class="sugg ghost" data-k="-1">None of these</button>`,'ask');
    $$('#fb .sugg').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(k<0){fb('');const i=$('#in');i.select();i.focus();return}$('#in').value=r.items[k].name;playCard(r.items[k])});
    $('#fb .sugg').focus({preventScroll:true});
    return;
  }
  fb(`<b>“${esc(text)}”</b> isn't on our list for this one. No penalty — try something else.`,'bad');nope();
}

async function playCard(item){
  if(busy) return;
  if(S.hand.some(h=>h.n===item.name)){fb(`You've already played <b>${esc(item.name)}</b> this round.`,'bad');nope();return}
  busy=true;fb('');
  const t=topZ(),bust=t>=0&&item.z<=t;
  S.hand.push({n:item.name,z:item.z});
  const k=S.hand.length-1,mode=S.mode;
  $('#action').classList.add('locked');
  S.mode='flip';drawHand(k);S.mode=mode;
  sfx('flip');
  await sleep(RM?60:640);
  const el=$('#hand').children[k];
  if(bust){
    S.hand[k].bust=true;el.classList.add('bust');el.querySelector('em').textContent='BUST';
    await sleep(RM?0:380);return endRound(true);
  }
  sfx('tier',item.z);floatText('+'+TIERS[item.z].pts,el,TIERS[item.z].c);
  if(item.z>=3){const r=el.getBoundingClientRect();FX.burst(r.left+r.width/2,r.top+r.height/2,item.z===4?['#fbbf24','#fde68a','#fff','#f59e0b']:['#c084fc','#e9d5ff','#a855f7'],item.z===4?120:45,item.z===4?12:8)}
  if(item.z===4)flash('radial-gradient(circle,rgba(251,191,36,.35),transparent 70%)');
  drawPot();const pv=$('#pv');if(pv)pv.classList.add('bump');
  if(item.z===4||S.hand.length===5){fb(`<b>${TIERS[item.z].n}!</b> Nothing is rarer than that — banked automatically.`,'good');await sleep(RM?200:1200);return endRound(false)}
  S.mode='decide';save();busy=false;drawDist();drawAction();
  fb(`<b>${esc(item.name)}</b> is <b style="color:${TIERS[item.z].c}">${TIERS[item.z].n}</b>${k?' — rarer than your last card. Nice climb!':'.'}`,'good');
}

async function endRound(bust){
  busy=true;
  const before=roundsTotal(),good=S.hand.filter(h=>!h.bust);
  const score=bust?0:sumPts(good)*good.length;
  S.rounds.push({c:S.cats[S.i],hand:S.hand.map(h=>({...h})),score,bust});
  S.mode='result';save();
  $('#action').innerHTML='';fb('');
  const cards=$$('#hand .card');
  if(bust){
    sfx('bust');flash('rgba(255,77,94,.28)');const st=$('#stage');st.classList.remove('enter');void st.offsetWidth;st.classList.add('shake');
    cards.forEach((e,i)=>{e.style.animationDelay=(i*70)+'ms';e.classList.add('fall')});await sleep(RM?50:1050);
  }else if(good.length){
    sfx('bank');cards.forEach((e,i)=>{e.style.animationDelay=(i*60)+'ms';e.classList.add('banked')});await sleep(RM?50:550);
  }
  updateTopbar(before);busy=false;drawResult();
}
function drawResult(){
  const r=S.rounds[S.rounds.length-1],c=cat();
  drawDist();
  $('#hand').innerHTML=r.hand.map(x=>cardHTML(x,false)).join('');
  const p=$('#pot');p.className='pot res';
  p.innerHTML=r.bust?`<span class="stamp bad">BUST</span>`:r.hand.length?`<span class="stamp good">+${r.score}</span>`:`<span class="stamp meh">SKIPPED</span>`;
  let why='';
  if(r.bust){const b=r.hand[r.hand.length-1],pv=r.hand[r.hand.length-2],g=r.hand.slice(0,-1);
    why=`<b>${esc(b.n)}</b> is only <b style="color:${TIERS[b.z].c}">${TIERS[b.z].n}</b> — not rarer than ${TIERS[pv.z].n}. Banking would have scored ${sumPts(g)*g.length}.`}
  else if(r.hand.length){const top=Math.max(...r.hand.map(h=>h.z));why=r.hand.length>=3?`A ${r.hand.length}-card climb, peaking at <b style="color:${TIERS[top].c}">${TIERS[top].n}</b>. 👏`:`Banked, peaking at <b style="color:${TIERS[top].c}">${TIERS[top].n}</b>.`}
  else why='No cards played this round.';
  const used=new Set(r.hand.map(h=>h.n)),rng=mulberry(S.i*131+c.list.length);
  const deep=c.list.filter(x=>x.z>=3&&!used.has(x.name)).map(x=>({x,k:rng()})).sort((a,b)=>b.x.z-a.x.z||a.k-b.k).slice(0,6).map(o=>o.x);
  const last=S.rounds.length>=S.cats.length;
  $('#action').innerHTML=`<p class="why">${why}</p>
    ${deep.length?`<div class="missed"><div class="eyebrow">Rare answers you could have played</div><div class="tags">${deep.map((x,i)=>`<span class="tag" style="--c:${TIERS[x.z].c};animation-delay:${i*60}ms">${esc(x.name)}</span>`).join('')}</div></div>`:''}
    <button class="btn-main big wide" id="next">${last?'See final score →':'Next round →'}</button>`;
  $('#next').onclick=nextRound;setTimeout(()=>$('#next')&&$('#next').focus({preventScroll:true}),80);
}
function nextRound(){
  if(busy)return;sfx('click');
  S.i++;S.hand=[];
  if(S.i>=S.cats.length)return finish();
  S.mode='pick';save();renderPlay();scrollTo({top:0,behavior:RM?'auto':'smooth'});
}
function finish(){
  S.phase='final';S.total=roundsTotal();
  if(S.kind==='daily'){const h=store.get(KEY+'history',{});h[S.day]=S.total;store.set(KEY+'history',h)}
  save();renderFinal(true);scrollTo({top:0});
}

/* ── FINAL ── */
function gridHTML(){return S.rounds.map((r,i)=>`<div class="gr" style="--d:${300+i*90}ms"><span>${i+1}</span>${r.hand.length?r.hand.map(h=>h.bust?'<i class="tile x">✕</i>':`<i class="tile" style="--c:${TIERS[h.z].c}"></i>`).join(''):'<i class="tile e"></i>'}<em>${r.score}</em></div>`).join('')}
function shareText(){return `OBSCURA ${S.kind==='daily'?'#'+S.num:'(practice)'} — ${S.total} pts · ${titleFor(S.total)}\n`+S.rounds.map(r=>r.hand.length?r.hand.map(h=>h.bust?'💥':TIERS[h.z].e).join(''):'➖').join('\n')+`\n${location.href.split(/[?#]/)[0]}`}
function localStats(){
  const h=store.get(KEY+'history',{}),vals=Object.values(h);let streak=0;
  for(let d=DAY;d>=0;d--){if(h[dayKey(d)]!=null)streak++;else if(d!==DAY)break}
  return {played:vals.length,best:vals.length?Math.max(...vals):0,avg:vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0,streak,h};
}
function localCompare(){const st=localStats();return `<div class="stats"><div class="stat"><b>${st.played}</b><small>played</small></div><div class="stat"><b>${st.streak}🔥</b><small>day streak</small></div><div class="stat"><b>${st.best}</b><small>best</small></div><div class="stat"><b>${st.avg}</b><small>average</small></div></div>
  <p class="muted" style="font-size:14px">The global leaderboard isn't switched on for this site yet, so these are your own stats. Share your grid to challenge friends!</p>`}
function renderFinal(fresh=false){
  busy=false;
  const rs=S.rounds,cards=rs.flatMap(r=>r.hand.filter(h=>!h.bust));
  const legends=cards.filter(h=>h.z===4).length,busts=rs.filter(r=>r.bust).length,best=Math.max(0,...rs.map(r=>r.score));
  const label=S.kind==='daily'?`Puzzle #${S.num} · ${fmtDate(S.day)}`:S.kind==='studio'?'Studio test':'Practice round';
  app.innerHTML=`<header class="top">${logo()}${icons()}</header>
  <section class="panel final enter">
    <div class="eyebrow">${label}</div>
    <div class="total" id="total">${fresh?0:S.total}</div><div class="muted">points</div>
    <div class="title-badge">🏅 ${titleFor(S.total)}</div>
    <div><div class="grid">${gridHTML()}</div></div>
    <div class="stats"><div class="stat"><b>${cards.length}</b><small>cards played</small></div><div class="stat"><b>${legends}</b><small>legendaries</small></div><div class="stat"><b>${busts}</b><small>busts</small></div><div class="stat"><b>${best}</b><small>best round</small></div></div>
    <div class="row center">
      ${S.kind==='studio'?`<button class="btn-main" id="tostudio">← Back to Studio</button>`:`<button class="btn-main" id="share">📋 Share result</button>`}
      ${S.kind==='practice'?'<button id="again">Another practice</button>':''}
      <button data-act="home">Home</button>
    </div>
    ${S.kind==='daily'?`<p class="muted" style="font-size:14px;margin-bottom:0">Next puzzle in <b id="cd">${countdown()}</b></p>`:''}
  </section>
  ${S.kind==='daily'?`<section class="panel enter" style="animation-delay:.15s"><div class="eyebrow">How you compare</div>
    ${LB_ON?(S.posted?`<p class="muted">Posted as <b style="color:var(--ink)">${esc(S.postedName||'')}</b> ✓</p>`:`<p class="muted" style="margin-bottom:0">Add your score to today's leaderboard:</p>
      <form class="field" id="post"><input id="nm" maxlength="20" placeholder="Your name" value="${esc(store.get(KEY+'name',''))}"><button class="btn-main">Post</button></form>`)+`<div id="cmp"><p class="muted">Loading today's players…</p></div>`
    :localCompare()}</section>`:''}
  <section class="panel enter" style="animation-delay:.25s"><div class="eyebrow" style="margin-bottom:10px">Your rounds</div><div class="log">${rs.map((r,i)=>{const c=BY_T.get(r.c)||TEMP;return `<div class="lr"><h4>${c?c.emoji:''} ${esc(c?c.t:r.c)}<span class="${r.score?'':'z'}">${r.bust?'BUST':r.score}</span></h4>
      ${r.hand.length?`<div class="chips">${r.hand.map(h=>`<span class="chip${h.bust?' x':''}" style="--c:${TIERS[h.z].c}">${esc(h.n)}<span class="pk" data-r="${i}" data-n="${esc(h.n)}"></span></span>`).join('')}</div>`:'<span class="muted" style="font-size:13px">Skipped</span>'}</div>`}).join('')}</div></section>`;
  if(fresh){countUp($('#total'),0,S.total,1400);setTimeout(()=>{if(S&&S.total>=1600){sfx('win');FX.rain(['#ff5fa2','#a35bff','#fbbf24','#38bdf8','#4ade80'])}},700)}
  if($('#share'))$('#share').onclick=share;
  if($('#tostudio'))$('#tostudio').onclick=()=>{S=null;renderStudio()};
  if($('#again'))$('#again').onclick=()=>{S=newGame('practice');render()};
  if($('#post'))$('#post').onsubmit=async e=>{
    e.preventDefault();const name=$('#nm').value.trim().slice(0,20);if(!name)return toast('Enter a name first');
    store.set(KEY+'name',name);const b=e.target.querySelector('button');b.disabled=true;b.textContent='Posting…';
    try{await lbPost({day:S.day,name,score:S.total,answers:S.rounds.map(r=>({c:r.c,a:r.hand.map(h=>h.n)}))});S.posted=true;S.postedName=name;save();renderFinal();toast('Posted! 🎉')}
    catch(err){b.disabled=false;b.textContent='Post';toast('Could not post — try again');console.error(err)}
  };
  if(S.kind==='daily'&&LB_ON)loadCompare();
}
async function share(){
  const txt=shareText();
  try{if(navigator.share&&matchMedia('(pointer:coarse)').matches){await navigator.share({text:txt});return}}catch(e){}
  try{await navigator.clipboard.writeText(txt);toast('Copied — paste it anywhere!')}
  catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied — paste it anywhere!')}catch(_){prompt('Copy your result:',txt)}t.remove()}
}

/* ════════════════════════ LEADERBOARD ════════════════════════ */
const lbH=()=>({apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+CONFIG.SUPABASE_ANON_KEY});
async function lbFetch(day){const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/scores?day=eq.${encodeURIComponent(day)}&select=name,score,answers&order=score.desc&limit=5000`,{headers:lbH()});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function lbPost(row){const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/scores`,{method:'POST',headers:{...lbH(),'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});if(!r.ok)throw new Error(await r.text())}
const roundAnswers=(row,i)=>{const a=row.answers&&row.answers[i];return a?(Array.isArray(a)?a:a.a||[]):[]};
function histogram(rows,mine){
  const max=Math.max(mine||0,...rows.map(r=>r.score),1),B=12,w=Math.ceil((max+1)/B),b=Array(B).fill(0);
  rows.forEach(r=>b[Math.min(B-1,Math.floor(r.score/w))]++);const top=Math.max(...b,1),mi=mine==null?-1:Math.min(B-1,Math.floor(mine/w));
  return `<div class="hist">${b.map((c,i)=>`<div class="${i===mi?'me':''}" style="height:${c/top*100}%;animation-delay:${i*40}ms" title="${i*w}–${(i+1)*w-1}: ${c}"></div>`).join('')}</div><div class="hist-axis"><span>0</span><span>${max}</span></div>`;
}
function boardTable(rows,meName,meScore,limit=10){let shown=false;return `<table class="board">${rows.slice(0,limit).map((r,i)=>{const me=!shown&&meName&&r.name===meName&&r.score===meScore;if(me)shown=true;return `<tr class="${me?'me':''}"><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td>${esc(r.name)}</td><td>${r.score}</td></tr>`}).join('')}</table>`}
async function loadCompare(){
  const box=$('#cmp');if(!box)return;
  try{
    const rows=await lbFetch(S.day),n=rows.length;if(!$('#cmp'))return;
    const others=S.posted?n-1:n,beat=rows.filter(r=>r.score<S.total).length,rank=rows.filter(r=>r.score>S.total).length+1;
    const pct=others>0?Math.round(beat/others*100):100;
    box.innerHTML=`<div class="stats"><div class="stat"><b>#${rank}</b><small>of ${S.posted?n:n+1}</small></div><div class="stat"><b>${pct}%</b><small>beaten</small></div><div class="stat"><b>${n?Math.round(rows.reduce((s,r)=>s+r.score,0)/n):0}</b><small>average</small></div><div class="stat"><b>${n?rows[0].score:S.total}</b><small>top score</small></div></div>
      ${n?histogram(rows,S.total)+`<div class="eyebrow" style="margin-top:16px">Today's top players</div>${boardTable(rows,S.postedName,S.total)}`:'<p class="muted">Nobody has posted yet today — be the first!</p>'}
      <div class="row center" style="margin-top:12px"><button data-act="board">Full leaderboard</button></div>`;
    if(n)$$('.pk').forEach(el=>{const i=+el.dataset.r,nm=el.dataset.n,c=rows.filter(r=>roundAnswers(r,i).includes(nm)).length;el.textContent=`${Math.round(c/n*100)}%`;el.title=`${Math.round(c/n*100)}% of players also played this`});
  }catch(e){box.innerHTML=`<p class="muted">Couldn't reach the leaderboard right now.</p>`;console.error(e)}
}
async function showBoard(day=DAY){
  if(!LB_ON){
    const st=localStats(),entries=Object.entries(st.h).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30);
    return openModal(`<h2>🏆 Leaderboard</h2><p>The global leaderboard isn't connected on this copy of Obscura yet. The site owner can switch it on in about five minutes with a free Supabase project — the steps are in the comment at the top of <b>index.html</b>.</p>
      <div class="eyebrow" style="margin-top:16px">Your history</div>${localCompare()}
      ${entries.length?`<table class="board">${entries.map(([d,s])=>`<tr><td>#${Math.round((Date.parse(d)-CONFIG.LAUNCH)/864e5)+1}</td><td>${fmtDate(d)}</td><td>${s}</td></tr>`).join('')}</table>`:'<p>No games yet — go play!</p>'}`);
  }
  const nav=()=>`<div class="daynav"><button id="dprev" ${day<=0?'disabled':''}>‹</button><b>Puzzle #${day+1} · ${fmtDate(dayKey(day))}</b><button id="dnext" ${day>=DAY?'disabled':''}>›</button></div>`;
  const wire=()=>{if($('#dprev'))$('#dprev').onclick=()=>showBoard(day-1);if($('#dnext'))$('#dnext').onclick=()=>showBoard(day+1)};
  openModal(`<h2>🏆 Leaderboard</h2>${nav()}<p>Loading…</p>`);wire();
  try{
    const rows=await lbFetch(dayKey(day));if($('#modal').classList.contains('hidden'))return;
    const mine=store.get(KEY+dayKey(day),null),me=mine&&mine.posted?{n:mine.postedName,s:mine.total}:null;
    $('#mb').innerHTML=`<h2>🏆 Leaderboard</h2>${nav()}${rows.length?`<p>${rows.length} player${rows.length>1?'s':''} · average ${Math.round(rows.reduce((s,r)=>s+r.score,0)/rows.length)}</p>${histogram(rows,me?me.s:null)}${boardTable(rows,me&&me.n,me&&me.s,100)}`:'<p>No scores posted for this puzzle yet.</p>'}`;wire();
  }catch(e){$('#mb').innerHTML=`<h2>🏆 Leaderboard</h2>${nav()}<p>Couldn't load the leaderboard.</p>`;wire()}
}

/* ════════════════════════ MODAL / HOW TO PLAY ════════════════════════ */
function openModal(html){$('#mb').innerHTML=html;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
const demo=(n,z,extra='')=>`<div class="card t${z} ${extra}" style="--c:${TIERS[z].c}"><div class="inner"><div class="face back">?</div><div class="face front"><span class="tier">${TIERS[z].n}</span><b>${n}</b><em>${extra.includes('bust')?'BUST':'+'+TIERS[z].pts}</em></div></div></div>`;
const HOW=[
  {t:'1. Name an answer',b:`Each round has a category. Type any valid answer — it becomes a card.`,v:`<div class="demo-cat">🍕 Name a pizza topping</div>${demo('Pepperoni',0,'reveal')}`},
  {t:'2. Flip it: how rare is it?',b:`Every answer has a hidden rarity. The more obscure, the more it's worth.`,v:TIERS.map((T,z)=>`<div class="card t${z}" style="--c:${T.c};animation-delay:${z*90}ms"><div class="inner"><div class="face front"><span class="tier">${T.n}</span><b>${['Everyone says it','Well known','Fans know it','Real knowledge','Experts only'][z]}</b><em>+${T.pts}</em></div></div></div>`).join('')},
  {t:'3. Bank it… or go rarer',b:`After each card, choose: <b>bank</b> your points, or <b>go rarer</b> by naming something rarer than your last card. Round score = card points × number of cards, so climbs pay off big.`,v:`${demo('Pepperoni',0)}${demo('Anchovies',1)}${demo('Truffle',3)}<div class="demo-eq">(10 + 25 + 100) × 3 cards = <b>405 pts</b></div>`},
  {t:"4. Don't bust!",b:`If your next card <b>isn't rarer</b> than the last one, you bust and the round scores 0. Reach Legendary and it banks automatically.<br>Typos are fine — we'll suggest the right spelling, and unknown answers cost nothing.`,v:`${demo('Pepperoni',0)}${demo('Truffle',3)}${demo('Ham',0,'bust')}<div class="demo-eq">Ham isn't rarer than Epic → <b style="color:var(--bad)">0 pts</b></div>`}
];
function howTo(i=0){
  const s=HOW[i];
  openModal(`<div class="slide"><h2>${s.t}</h2><p style="margin:4px 0 0">${s.b}</p><div class="vis">${s.v}</div></div>
    <div class="dots">${HOW.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
    <div class="row">${i>0?'<button id="hprev">← Back</button>':''}<button class="btn-main" id="hnext" style="flex:1">${i<HOW.length-1?'Next →':"Got it — let's play!"}</button></div>`);
  if($('#hprev'))$('#hprev').onclick=()=>howTo(i-1);
  $('#hnext').onclick=()=>{if(i<HOW.length-1)howTo(i+1);else closeModal()};
  $('#hnext').focus({preventScroll:true});
}

/* ════════════════════════ CATEGORY STUDIO (admin, open with #studio) ════════════════════════ */
const GUIDE=['Most people say it within 5 seconds','Well known, but not the first answer','Fans & enthusiasts know it','Takes real knowledge','Only experts & obsessives'];
const blankDraft=()=>({emoji:'🍕',theme:'food',t:'',p:'',z:['','','','','']});
const rowToDraft=row=>({emoji:row[0],theme:row[1],t:row[2],p:row[3],z:row.slice(4,9).map(s=>String(s||'').split('|').map(x=>x.split('/').map(y=>y.trim()).join(' / ')).join('\n'))});
const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
const draftToRow=d=>[d.emoji||'❓',d.theme,d.t.trim(),d.p.trim(),...d.z.map(s=>lines(s).map(x=>x.replace(/\|/g,'').split('/').map(y=>y.trim()).filter(Boolean).join('/')).join('|'))];
function renderStudio(){
  S=null;busy=false;closeModal();
  const d=store.get(KEY+'studio',null)||blankDraft();
  app.innerHTML=`<header class="top">${logo()}${icons()}</header>
  <section class="panel studio enter">
    <h2>🛠 Category Studio</h2>
    <p class="muted" style="line-height:1.55">Create or edit a category, test-play it, then copy the generated code into the <code>CATS</code> list in <b>index.html</b>. Nothing here changes the live game until you do. Your draft saves automatically in this browser.</p>
    <label class="fld"><span>Start from</span><select id="st-load"><option value="">✨ Keep my current draft</option><option value="new">📄 Blank category</option>${BANK.map((c,i)=>`<option value="${i}">${c.emoji} ${esc(c.t)} (${c.list.length})</option>`).join('')}</select></label>
    <div class="fgrid">
      <label class="fld"><span>Emoji</span><input id="st-emoji" maxlength="8"></label>
      <label class="fld"><span>Title</span><input id="st-t" placeholder="Pizza Toppings"></label>
      <label class="fld"><span>Theme</span><select id="st-theme">${Object.entries(THEMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
    </div>
    <label class="fld"><span>Prompt players see</span><input id="st-p" placeholder="Name a pizza topping"></label>
    <details><summary>⚡ Quick start: paste a ranked list</summary><p class="muted" style="font-size:14px">One answer per line, <b>most famous first</b>, most obscure last. It gets split across the five rarities, then you fine-tune below.</p><textarea id="st-rank" rows="7"></textarea><div class="row" style="margin-top:8px"><button id="st-split">Split into rarities</button></div></details>
    ${TIERS.map((T,z)=>`<div class="tierbox" style="--c:${T.c}"><div class="th"><b>${T.n}</b><span>${T.pts} pts · ${GUIDE[z]}</span><em id="st-n${z}">0</em></div><textarea id="st-z${z}" rows="4" placeholder="One answer per line. Extra spellings with a slash, e.g.  Ivory Coast / Côte d'Ivoire"></textarea></div>`).join('')}
    <div id="st-warn" class="warn"></div>
    <div class="row"><button class="btn-main" id="st-test">▶ Test play</button><button id="st-copy">📋 Copy code</button>${LB_ON?'<button id="st-cal">📊 Calibrate from player data</button>':''}</div>
    <div id="st-cal-out"></div>
    <label class="fld" style="margin-top:16px"><span>Generated code — paste inside <code>const CATS = [ … ]</code> (replace the old line if you edited an existing category)</span><textarea id="st-out" rows="7" readonly style="font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea></label>
    <p class="muted" style="font-size:13px;line-height:1.55">Tips: aim for 40+ answers with at least 4 in every rarity. Closed sets (all countries, all NBA teams…) work best, because players can't name a valid answer you forgot. Once the leaderboard is on, <b>Calibrate</b> uses real players' answers to suggest rarities.</p>
  </section>`;
  const F=id=>$('#'+id);
  const read=()=>({emoji:F('st-emoji').value.trim(),t:F('st-t').value,p:F('st-p').value,theme:F('st-theme').value,z:[0,1,2,3,4].map(z=>F('st-z'+z).value)});
  function update(){
    const x=read();store.set(KEY+'studio',x);
    const counts=x.z.map(s=>lines(s).length);counts.forEach((n,z)=>F('st-n'+z).textContent=n);
    const seen={},dups=[];x.z.forEach(s=>lines(s).forEach(l=>l.split('/').forEach(a=>{const k=norm(a);if(!k)return;if(seen[k]&&seen[k]!==l)dups.push(a.trim());seen[k]=l})));
    const w=[];if(!x.t.trim())w.push('Add a title.');if(!x.p.trim())w.push('Add a prompt (e.g. “Name a pizza topping”).');
    counts.forEach((n,z)=>{if(n<3)w.push(`${TIERS[z].n} has only ${n} answer${n===1?'':'s'} — aim for at least 4.`)});
    if(dups.length)w.push('Duplicates: '+[...new Set(dups)].slice(0,8).map(esc).join(', '));
    const total=counts.reduce((a,b)=>a+b,0);if(total&&total<25)w.push(`Only ${total} answers in total — 40+ makes a better round.`);
    if(BY_T.has(x.t.trim()))w.push(`<span class="ok">A category called “${esc(x.t.trim())}” already exists — paste your line over the old one.</span>`);
    F('st-warn').innerHTML=w.length?w.map(s=>'• '+s).join('<br>'):'<span class="ok">✓ Looks good! Test it, then copy the code.</span>';
    const row=draftToRow(x);
    F('st-out').value='['+row.slice(0,4).map(s=>JSON.stringify(s)).join(',')+',\n'+row.slice(4).map(s=>JSON.stringify(s)).join(',\n')+'],';
  }
  const fill=x=>{F('st-emoji').value=x.emoji;F('st-t').value=x.t;F('st-p').value=x.p;F('st-theme').value=x.theme;x.z.forEach((s,z)=>F('st-z'+z).value=s);update()};
  fill(d);
  ['st-emoji','st-t','st-p','st-theme','st-z0','st-z1','st-z2','st-z3','st-z4'].forEach(id=>F(id).addEventListener('input',update));
  F('st-load').onchange=e=>{const v=e.target.value;if(v==='new')fill(blankDraft());else if(v!=='')fill(rowToDraft(BANK[+v].row));e.target.value=''};
  F('st-split').onclick=()=>{const L=lines(F('st-rank').value);if(!L.length)return toast('Paste some answers first');const cuts=[.14,.34,.6,.84,1].map(f=>Math.round(L.length*f));let s=0;cuts.forEach((e,z)=>{F('st-z'+z).value=L.slice(s,e).join('\n');s=e});update();toast(`Split ${L.length} answers into 5 rarities`)};
  F('st-copy').onclick=async()=>{try{await navigator.clipboard.writeText(F('st-out').value);toast('Code copied!')}catch(e){F('st-out').select();document.execCommand('copy');toast('Code copied!')}};
  F('st-test').onclick=()=>{const x=read();if(!x.t.trim()||!x.p.trim())return toast('Add a title and prompt first');TEMP=buildCat(draftToRow(x));if(TEMP.list.length<2)return toast('Add some answers first');S=newGame('studio');renderPlay();scrollTo({top:0})};
  if(F('st-cal'))F('st-cal').onclick=async()=>{
    const x=read(),out=F('st-cal-out');out.innerHTML='<p class="muted">Loading player data…</p>';
    try{
      const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/scores?select=answers&limit=20000`,{headers:lbH()});const rows=await r.json();
      let plays=0;const cnt={};rows.forEach(row=>(row.answers||[]).forEach(a=>{if(a&&a.c===x.t.trim()){plays++;(a.a||[]).forEach(n=>cnt[n]=(cnt[n]||0)+1)}}));
      if(plays<10){out.innerHTML=`<p class="muted">Only ${plays} play${plays===1?'':'s'} of “${esc(x.t)}” so far — calibration needs at least 10.</p>`;return}
      const byName={};x.z.forEach((s,z)=>lines(s).forEach(l=>{byName[l.split('/')[0].trim()]={l,z}}));
      const sug=Object.entries(byName).map(([n,o])=>{const c=cnt[n]||0,sh=c/plays;return{n,l:o.l,z:o.z,c,nz:c===0?o.z:sh>=.2?0:sh>=.08?1:sh>=.03?2:sh>=.01?3:4}});
      const ch=sug.filter(s=>s.nz!==s.z);
      out.innerHTML=`<p class="muted">${plays} plays analysed. ${ch.length} answer${ch.length===1?'':'s'} could move (answers nobody has played keep their rarity).</p>`+(ch.length?`<table class="cal">${ch.slice(0,60).map(s=>`<tr><td>${esc(s.n)}</td><td style="color:${TIERS[s.z].c}">${TIERS[s.z].n}</td><td>→</td><td style="color:${TIERS[s.nz].c}">${TIERS[s.nz].n}</td><td class="muted">${Math.round(s.c/plays*100)}%</td></tr>`).join('')}</table><button id="st-apply">Apply suggestions</button>`:'');
      if(F('st-apply'))F('st-apply').onclick=()=>{const zs=['','','','',''];sug.forEach(s=>zs[s.nz]+=(zs[s.nz]?'\n':'')+s.l);zs.forEach((s,z)=>F('st-z'+z).value=s);update();toast('Rarities updated')};
    }catch(e){out.innerHTML='<p class="muted">Couldn\'t load player data.</p>'}
  };
}

/* ════════════════════════ BOOT ════════════════════════ */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='home'){closeModal();if(busy)return;if(location.hash)history.replaceState(null,'',location.pathname+location.search);renderHome()}
  else if(act==='how')howTo(0);
  else if(act==='board')showBoard();
  else if(act==='snd'){SND.on=!SND.on;store.set(KEY+'sound',SND.on);$$('[data-act="snd"]').forEach(b=>b.textContent=SND.on?'🔊':'🔇');if(SND.on)sfx('click')}
});
$('#mx').onclick=closeModal;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')return closeModal();
  if(!$('#modal').classList.contains('hidden')||!S||S.phase!=='play'||busy)return;
  if(S.mode==='decide'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){const k=e.key.toLowerCase();if(k==='b'){e.preventDefault();endRound(false)}else if(k==='r'){e.preventDefault();goRarer()}}
});
addEventListener('hashchange',()=>{if(location.hash==='#studio')renderStudio();else if(!S||S.kind==='studio')renderHome()});
render();
if(location.hash!=='#studio'&&!store.get(KEY+'seenHelp',false)){store.set(KEY+'seenHelp',true);howTo(0)}
</script>
</body>
</html>
